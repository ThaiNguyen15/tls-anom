paths:
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  models_dir: data/models
  outputs_dir: outputs
  logs_dir: logs
  zeek_dir: data/processed/zeek

pipeline:
  stages: [extract, label, featurize, preprocess, train, predict, evaluate]

features:
  sni_hash_bits: 16
  numeric:
    - pkt_per_flow
    - bytes_per_flow
    - sni_hash
model:
  kind: iforest_lgbm
  contamination: 0.01   # hoặc 0.02–0.05 nếu muốn bắt nhạy hơn
  train_on: normal

input:
  feature_csv: data/features/normal.features.csv

alert:
  threshold: 0.05    # SOC-style low threshold
  top_k: 5

